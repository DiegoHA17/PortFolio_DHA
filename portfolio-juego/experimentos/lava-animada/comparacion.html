<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba: lava animada (experimento aislado)</title>
<link rel="stylesheet" href="../../src/css/estilos.css">
<link rel="stylesheet" href="../../src/css/escenario.css">
<style>
  /* Estilos solo de esta pagina de prueba -- no toca nada del juego real. */
  body { overflow-y: auto; }
  .barra-prueba {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: #090a12; border-bottom: 4px solid #1f2130;
    font-family: var(--fuente-pixel); color: #f7f4dc; font-size: 0.8rem;
  }
  .barra-prueba button {
    font: inherit; padding: 6px 12px; cursor: pointer;
    background: #141421; color: #f7f4dc; border: 2px solid rgba(199,86,255,.68);
  }
  .barra-prueba button[aria-pressed="true"] { background: #3a1a40; border-color: #ff6b6b; }
  .barra-prueba label { display: inline-flex; align-items: center; gap: 5px; opacity: .85; }
  .barra-prueba .etiqueta { padding: 3px 10px; border-radius: 3px; font-size: 0.7rem; }
  .etiqueta.original { background: #2a2a2a; }
  .etiqueta.animado { background: #5a2a1a; color: #ffb37a; }
  /* Sin override de altura: se usa la formula real de escenario.css para que el encuadre
     y la escala sean identicos al juego (no hace falta cabecera/pie reales, solo las
     variables --alto-cabecera/--alto-pie que ya vienen de estilos.css). */
  .capa-lava-animada {
    position: absolute; inset: 0;
    image-rendering: pixelated;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center top;
    transition: opacity 120ms ease;
  }
  .capa-lava-animada.oculta { opacity: 0; pointer-events: none; }
  #capaCascada1 { z-index: 1; }
  #capaCascada2 { z-index: 2; }
  #capaSuelo { z-index: 3; }
</style>
</head>
<body>
  <div class="barra-prueba">
    <strong>Prueba aislada: lava animada</strong>
    <button id="btnToggle" type="button" aria-pressed="false">Activar animación</button>
    <span id="etiquetaEstado" class="etiqueta original">ORIGINAL</span>
    <label><input type="checkbox" id="chkCascada1" checked> Cascada 1</label>
    <label><input type="checkbox" id="chkCascada2" checked> Cascada 2</label>
    <label><input type="checkbox" id="chkSuelo" checked> Suelo + burbujas</label>
    <button id="btnScroll1" type="button">Simular cámara: arriba</button>
    <button id="btnScroll2" type="button">Simular cámara: abajo</button>
    <button id="btnScroll3" type="button">Simular cámara: suelo</button>
  </div>

  <main class="escenario" data-nivel-actual="1">
    <div id="capaCascada1" class="capa-lava-animada oculta"></div>
    <div id="capaCascada2" class="capa-lava-animada oculta"></div>
    <div id="capaSuelo" class="capa-lava-animada oculta"></div>
  </main>

<script>
(function(){
  const NUM_FRAMES = 8;
  const MS_POR_FRAME = 160;
  const CAPAS = [
    { el: document.getElementById('capaCascada1'), chk: document.getElementById('chkCascada1'), prefijo: 'cascada1' },
    { el: document.getElementById('capaCascada2'), chk: document.getElementById('chkCascada2'), prefijo: 'cascada2' },
    { el: document.getElementById('capaSuelo'),    chk: document.getElementById('chkSuelo'),    prefijo: 'suelo' }
  ];
  const boton = document.getElementById('btnToggle');
  const etiqueta = document.getElementById('etiquetaEstado');
  let indice = 0;
  let activo = false;
  let intervalo = null;

  function rutaFrame(prefijo, i){ return `url("recursos/frames/${prefijo}-${i}.png")`; }

  function aplicarVisibilidad(){
    for (const capa of CAPAS){
      capa.el.classList.toggle('oculta', !activo || !capa.chk.checked);
    }
  }

  function siguienteFrame(){
    indice = (indice + 1) % NUM_FRAMES;
    for (const capa of CAPAS){
      capa.el.style.backgroundImage = rutaFrame(capa.prefijo, indice);
    }
  }
  siguienteFrame(); // precarga fotograma 1 desde ya

  boton.addEventListener('click', () => {
    activo = !activo;
    boton.setAttribute('aria-pressed', String(activo));
    boton.textContent = activo ? 'Desactivar animación' : 'Activar animación';
    etiqueta.textContent = activo ? 'ANIMADO' : 'ORIGINAL';
    etiqueta.className = 'etiqueta ' + (activo ? 'animado' : 'original');
    aplicarVisibilidad();
    if (activo && !intervalo) {
      intervalo = setInterval(siguienteFrame, MS_POR_FRAME);
    } else if (!activo && intervalo) {
      clearInterval(intervalo);
      intervalo = null;
    }
  });

  for (const capa of CAPAS){
    capa.chk.addEventListener('change', aplicarVisibilidad);
  }

  document.getElementById('btnScroll1').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.getElementById('btnScroll2').addEventListener('click', () => {
    window.scrollTo({ top: 400, behavior: 'smooth' });
  });
  document.getElementById('btnScroll3').addEventListener('click', () => {
    window.scrollTo({ top: 750, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
